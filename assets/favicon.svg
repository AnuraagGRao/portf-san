<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="portfGrad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="portfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#090a0f" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#portfGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Code / Systems Terminal Prompt Caret ">" -->
  <path d="M17 21L27 32L17 43" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#portfGlow)" />

  <!-- Architecture Node / Pulse Underscore "_" -->
  <line x1="31" y1="43" x2="47" y2="43" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Top Right Connectivity Node Spark -->
  <circle cx="43" cy="22" r="3.5" fill="#10b981" filter="url(#portfGlow)" />
  <circle cx="43" cy="22" r="1.5" fill="#ffffff" />
</svg>
